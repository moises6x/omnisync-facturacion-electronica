# Soporte de precheck: NO se carga automaticamente, NO autoriza arrancar ni enviar.
# Overlay externo para el MISMO JAR, despues de aprobar variables, BD y precheck.
# El endpoint se hereda de application-beta.properties; no se duplica aqui.
server.address=127.0.0.1
server.forward-headers-strategy=none
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=validate
security.bootstrap.enabled=false
security.bootstrap.auto-create=false
sunat.resumen-diario.auto.enabled=false
sunat.comunicacion-baja.auto.enabled=false
sunat.padron-ruc.actualizacion.enabled=false
# Exigir directorio NUEVO, absoluto, externo y sin enlaces simbolicos.
sunat.padron-ruc.path=${FASE5_PADRON_METADATA_PATH}
sunat.padron-ruc.actualizacion.version-inicial=
sunat.certificate.monitor.enabled=false
security.refresh.cleanup.enabled=false
admin.suscripciones.cron=-
# Recovery NO tiene interruptor: diferido, no deshabilitado.
# Ventana maxima 45 minutos; parar antes de 60 minutos desde cada arranque.
sunat.envio-recovery.initial-delay-ms=3600000
sunat.envio-recovery.delay-ms=3600000
sunat.envio-recovery.batch-size=1
sunat.async.core-pool-size=1
sunat.async.max-pool-size=1
sunat.async.queue-capacity=1
sunat.debug.xml=false
logging.level.org.example.util.ObservabilidadFiscal=INFO
