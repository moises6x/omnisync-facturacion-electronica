# ==========================================================
# ==========================================================
#
#                   SUNAT PRODUCCIÓN
#
# ==========================================================
# ==========================================================
#
# ESTE ARCHIVO SE UTILIZA ÚNICAMENTE CUANDO:
#
# SPRING_PROFILES_ACTIVE=prod
#
#
# ==========================================================
# NO PONER SECRETOS AQUÍ
# ==========================================================
#
# Claves, passwords y rutas sensibles deben venir
# de variables de entorno del servidor.
#
# ==========================================================


# ==========================================================
# BASE DE DATOS PRODUCCIÓN
# ==========================================================
#
# El servidor deberá proporcionar:
#
# SPRING_DATASOURCE_URL
# SPRING_DATASOURCE_USERNAME
# SPRING_DATASOURCE_PASSWORD
#
# ==========================================================

spring.datasource.url=${SPRING_DATASOURCE_URL}

spring.datasource.username=${SPRING_DATASOURCE_USERNAME}

spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}


# ==========================================================
# HIBERNATE PRODUCCIÓN
# ==========================================================
#
# MUY IMPORTANTE:
#
# Hibernate NO debe crear ni modificar automáticamente
# las tablas de producción.
#
# validate solamente comprueba que el esquema existente
# sea compatible con nuestras entidades.
#
# Más adelante implementaremos Flyway para controlar
# formalmente todas las migraciones.
#
# ==========================================================

spring.jpa.hibernate.ddl-auto=validate


# ==========================================================
# BOOTSTRAP MANUAL
# ==========================================================

security.bootstrap.enabled=false


# ==========================================================
# SUPERADMIN AUTOMÁTICO
# ==========================================================

security.bootstrap.auto-create=${SECURITY_BOOTSTRAP_AUTO_CREATE:false}


# ==========================================================
# CORS PRODUCCIÓN
# ==========================================================
#
# Debe configurarse por variable de entorno con el dominio real.
#
# Ejemplo:
# APP_CORS_ALLOWED_ORIGINS=https://facturacion.omnisyncsd.com
#
# ==========================================================

security.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}


# ==========================================================
# SUNAT PRODUCCIÓN
# ==========================================================

sunat.environment=PRODUCCION

sunat.billservice.url=https://e-factura.sunat.gob.pe/ol-ti-itcpfegem/billService


# ==========================================================
# CERTIFICADO PRODUCCIÓN / TRUSTSTORE
# ==========================================================
#
# Variables necesarias:
#
# SUNAT_CERT_TRUSTSTORE_PATH
# SUNAT_CERT_TRUSTSTORE_PASSWORD
#
# ==========================================================

sunat.certificate.production.truststore-path=${SUNAT_CERT_TRUSTSTORE_PATH}

sunat.certificate.production.truststore-password=${SUNAT_CERT_TRUSTSTORE_PASSWORD}

sunat.certificate.production.truststore-type=${SUNAT_CERT_TRUSTSTORE_TYPE:PKCS12}


# ==========================================================
# XML PRODUCCIÓN
# ==========================================================

sunat.debug.xml=false


# ==========================================================
# RSA PRODUCCIÓN
# ==========================================================

sunat.certificate.min-rsa-bits=2048


# ==========================================================
# RESUMEN DIARIO AUTOMÁTICO - PRODUCCIÓN
# ==========================================================
#
# En producción se mantiene activo para no depender
# de una ejecución manual del resumen.
#
# ==========================================================

sunat.resumen-diario.auto.enabled=true
