# ==========================================================
# ==========================================================
#
#                    SUNAT BETA
#
# ==========================================================
# ==========================================================
#
# ESTE PERFIL ES ÚNICAMENTE PARA:
#
# - desarrollo
# - pruebas
# - certificados autofirmados
# - usuario MODDATOS
#
# Producción arrancará con:
#
# SPRING_PROFILES_ACTIVE=prod
#
# ==========================================================


# ==========================================================
# BASE DE DATOS
# ==========================================================
#
# En esta etapa la BD BETA ya existe y fue validada.
# Hibernate sólo debe comprobar compatibilidad del esquema.
#
# ==========================================================

spring.jpa.hibernate.ddl-auto=validate


# ==========================================================
# BOOTSTRAP
# ==========================================================
#
# Los valores reales se controlan por variables de entorno.
# Para nuestras pruebas con frontend los pondremos en false
# desde IntelliJ.
#
# ==========================================================

security.bootstrap.enabled=${SECURITY_BOOTSTRAP_ENABLED:true}

security.bootstrap.auto-create=${SECURITY_BOOTSTRAP_AUTO_CREATE:true}


# ==========================================================
# SUNAT BETA
# ==========================================================

sunat.environment=BETA

sunat.billservice.url=https://e-beta.sunat.gob.pe/ol-ti-itcpfegem-beta/billService


# ==========================================================
# DEBUG XML
# ==========================================================

sunat.debug.xml=false


# ==========================================================
# RSA BETA
# ==========================================================

sunat.certificate.min-rsa-bits=1024


# ==========================================================
# RESUMEN DIARIO AUTOMÁTICO - BETA
# ==========================================================
#
# Durante pruebas manuales desde frontend permanece apagado.
#
# ==========================================================

sunat.resumen-diario.auto.enabled=false
