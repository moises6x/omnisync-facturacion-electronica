# ==========================================================
# OMNISYNC FACTURACIÓN - PERFIL TEST
# ==========================================================
# Base exclusiva. NUNCA apuntar a bd_facturacion / producción.

spring.datasource.url=jdbc:mysql://localhost:3306/bd_facturacion_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima
spring.datasource.username=${TEST_DB_USERNAME:facturacion_test}
spring.datasource.password=${TEST_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima
spring.flyway.enabled=false

app.time-zone=America/Lima
spring.jackson.time-zone=America/Lima
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF

sunat.environment=BETA
sunat.billservice.url=https://e-beta.sunat.gob.pe/ol-ti-itcpfegem-beta/billService
sunat.debug.xml=false
sunat.certificate.min-rsa-bits=1024
sunat.resumen-diario.auto.enabled=false
sunat.comunicacion-baja.auto.enabled=false
sunat.certificate.monitor.enabled=false
sunat.padron-ruc.actualizacion.enabled=false
sunat.cdr.require-reference-id=false
sunat.plazos.envio-individual-dias=3
sunat.plazos.resumen-diario-dias=7
sunat.plazos.baja-dias=7
sunat.validation.xsd.voided=classpath:sunat-xsd/2.0/maindoc/UBLPE-VoidedDocuments-1.0.xsd

security.secrets.master-key-base64=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
security.jwt.secret-base64=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
security.jwt.issuer=omnisync-test
security.jwt.access-minutes=30
security.admin-key=TEST_ADMIN_KEY_123456789012345678901234567890
security.bootstrap.enabled=false
security.bootstrap.auto-create=false
security.cors.allowed-origins=http://localhost:4200
management.endpoints.web.exposure.include=health
