# =========================================================
# OMNISYNC FACTURACIÓN
# CONFIGURACIÓN COMÚN
# =========================================================
#
# ESTE ARCHIVO NO DEBE CONTENER:
#
# - endpoint BETA
# - endpoint PRODUCCIÓN
# - credenciales reales
# - claves secretas
#
# Las diferencias por ambiente están en:
#
# application-beta.properties
# application-prod.properties
#
# =========================================================


# =========================================================
# SERVIDOR
# =========================================================

server.port=${PORT:8082}

# =========================================================
# ZONA HORARIA TRIBUTARIA
# =========================================================
#
# La JVM puede ejecutarse en UTC, Docker, VPS, etc.
# Todo el backend fiscal peruano debe trabajar con la misma zona.
#
app.time-zone=America/Lima
spring.jackson.time-zone=America/Lima

# =========================================================
# PERFIL
# =========================================================
#
# DESARROLLO:
#
# SPRING_PROFILES_ACTIVE=beta
#
# PRODUCCIÓN:
#
# SPRING_PROFILES_ACTIVE=prod
#
# Si no se especifica, usamos BETA por seguridad.
#
# IMPORTANTE:
# NO BORRAR application-beta.properties cuando pasemos
# a producción.
#
# Simplemente producción arrancará con:
#
# SPRING_PROFILES_ACTIVE=prod
#
# =========================================================

spring.profiles.active=${SPRING_PROFILES_ACTIVE:}
app.deployment.environment=${APP_DEPLOYMENT_ENVIRONMENT:}
app.beta.datasource-url=${APP_BETA_DATASOURCE_URL:}


# Reverse proxy / Nginx / Cloudflare

server.forward-headers-strategy=none

# Cierre ordenado para permitir terminar trabajos en curso.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s


# =========================================================
# MYSQL
# =========================================================
#
# En BETA se permiten estos valores locales por defecto.
#
# application-prod.properties sobrescribirá URL y usuario
# y obligará a proporcionarlos mediante variables de entorno.
#
# =========================================================

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/bd_facturacion?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima&allowLoadLocalInfile=true}

spring.datasource.username=${SPRING_DATASOURCE_USERNAME:facturacion_app}

spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}


# =========================================================
# JPA
# =========================================================
#
# ddl-auto NO se configura aquí.
#
# BETA:
# update
#
# PRODUCCIÓN:
# validate
#
# =========================================================

spring.jpa.show-sql=false

spring.jpa.open-in-view=false


# =========================================================
# MULTIPART
# =========================================================

spring.servlet.multipart.max-file-size=2MB

spring.servlet.multipart.max-request-size=3MB


# =========================================================
# REGLAS TRIBUTARIAS
# =========================================================

tributacion.igv-porcentaje=18.00

# Tasas que esta versión puede asignar por empresa.
# La tasa especial NO se asigna automáticamente: requiere validación previa.
tributacion.igv-porcentajes-permitidos=18.00,10.50

tributacion.boleta-identificacion-umbral=700.00

tributacion.tipos-operacion-soportados=0101


# =========================================================
# XSD SUNAT
# =========================================================

sunat.validation.xsd.enabled=true

sunat.validation.xsd.invoice=classpath:sunat-xsd/2.1/maindoc/UBL-Invoice-2.1.xsd

sunat.validation.xsd.credit-note=classpath:sunat-xsd/2.1/maindoc/UBL-CreditNote-2.1.xsd

# Resumen Diario SUNAT utiliza SummaryDocuments UBL 2.0.
sunat.validation.xsd.summary=classpath:sunat-xsd/2.0/maindoc/UBLPE-SummaryDocuments-1.0.xsd


# =========================================================
# SUNAT - CONFIGURACIÓN COMÚN
# =========================================================

sunat.connect-timeout=10000

sunat.read-timeout=20000

# =========================================================
# WORKERS SUNAT
# =========================================================

sunat.async.core-pool-size=1
sunat.async.max-pool-size=2
sunat.async.queue-capacity=100
sunat.async.await-termination-seconds=30

# Recupera únicamente documentos que quedaron PENDIENTE_ENVIO
# por caída del proceso después del COMMIT.
sunat.envio-recovery.delay-ms=60000
sunat.envio-recovery.initial-delay-ms=30000
sunat.envio-recovery.batch-size=20

# =========================================================
# RESUMEN DIARIO SUNAT
# =========================================================
#
# Máximo oficial por archivo RC: 500 líneas.
#
# El scheduler genera el cierre del día a las 23:50 hora Perú y
# además ejecuta una recuperación horaria de fechas anteriores.
#
# sendSummary devuelve ticket; getStatus se consulta de forma periódica
# hasta obtener la CDR.
# =========================================================

sunat.resumen-diario.max-lineas=500
sunat.resumen-diario.zone=America/Lima

# Automatización del flujo.
sunat.resumen-diario.auto.enabled=false

# Cierre del día actual: 23:50 hora Perú.
sunat.resumen-diario.generacion-cron=0 50 23 * * *

# Recuperación de pendientes de días anteriores: minuto 15 de cada hora.
sunat.resumen-diario.recovery-cron=0 15 * * * *

# Cantidad máxima de RC que puede crear un ciclo automático.
sunat.resumen-diario.max-resumenes-por-ciclo=50

# Recuperación de cabeceras CREADO después de reinicios.
sunat.resumen-diario.creados-delay-ms=120000
sunat.resumen-diario.creados-initial-delay-ms=60000
sunat.resumen-diario.creados-batch-size=20

# Consulta automática de tickets sendSummary.
sunat.resumen-diario.ticket-delay-ms=60000
sunat.resumen-diario.ticket-initial-delay-ms=45000
sunat.resumen-diario.ticket-batch-size=30

# Un ENVIANDO sin ticket durante demasiado tiempo se marca como
# ERROR_ENVIO_INCIERTO y NO se reenvía automáticamente.
sunat.resumen-diario.enviando-timeout-minutes=10
sunat.resumen-diario.enviando-watch-delay-ms=300000
sunat.resumen-diario.enviando-watch-initial-delay-ms=120000


# =========================================================
# CERTIFICADOS
# =========================================================
#
# Nuestro firmador utiliza RSA-SHA256.
#
# El mínimo se mantiene configurable.
#
# =========================================================

sunat.certificate.min-rsa-bits=1024


# =========================================================
# SEGURIDAD - MASTER KEY
# =========================================================
#
# AES-256.
#
# Cifra:
#
# - Usuario SOL
# - Clave SOL
# - PFX
# - contraseña PFX
#
# JAMÁS escribir aquí el valor.
#
# =========================================================

security.secrets.master-key-base64=${APP_MASTER_KEY_BASE64}


# =========================================================
# ADMIN KEY
# =========================================================
#
# Se conserva principalmente para bootstrap/control interno.
#
# NO es una contraseña de usuario.
#
# =========================================================

security.admin-key=${APP_ADMIN_KEY}
security.bootstrap.initial-password=${SECURITY_BOOTSTRAP_INITIAL_PASSWORD:}


# =========================================================
# JWT
# =========================================================

security.jwt.secret-base64=${APP_JWT_SECRET_BASE64}

security.jwt.issuer=${APP_JWT_ISSUER:omnisync-facturacion}

security.jwt.access-minutes=30


# =========================================================
# REFRESH TOKEN
# =========================================================

security.refresh.days=30

security.refresh.cleanup.enabled=true

security.refresh.cleanup.cron=0 30 3 * * *

security.refresh.cleanup.zone=America/Lima


# =========================================================
# FUERZA BRUTA
# =========================================================

security.auth.max-failed-attempts=5

security.auth.lock-minutes=15


# =========================================================
# CORS
# =========================================================
#
# Producción sobrescribe esta propiedad y NO tendrá
# localhost como valor predeterminado.
#
# =========================================================

security.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:5173}


# =========================================================
# RATE LIMIT
# =========================================================

security.rate-limit.login-limit=10

security.rate-limit.login-window-seconds=300

security.rate-limit.refresh-limit=30

security.rate-limit.refresh-window-seconds=60

security.rate-limit.general-limit=300

security.rate-limit.general-window-seconds=60


# =========================================================
# ERRORES
# =========================================================

server.error.include-message=never

server.error.include-stacktrace=never

server.error.include-exception=false

server.error.include-binding-errors=never


# =========================================================
# PADRÓN RUC SUNAT
# =========================================================

sunat.padron-ruc.path=./padron_reducido_ruc

sunat.padron-ruc.charset=windows-1252

sunat.padron-ruc.actualizacion.enabled=true

sunat.padron-ruc.actualizacion.default-mode=SEMANAL

sunat.padron-ruc.actualizacion.default-day=DOMINGO

sunat.padron-ruc.actualizacion.default-time=02:00

sunat.padron-ruc.actualizacion.zone=America/Lima

sunat.padron-ruc.actualizacion.page-url=https://www.sunat.gob.pe/descargaPRR/mrc137_padron_reducido.html

sunat.padron-ruc.actualizacion.version-inicial=2026-09-15

# =========================================================
# FLYWAY
# =========================================================
#
# TEMPORALMENTE DESACTIVADO.
#
# Tu bd_facturacion ya existía antes de incorporar Flyway.
# Primero terminaremos las entidades/tablas del Resumen Diario y luego
# prepararemos un baseline/migraciones controladas para producción.
#
# NO cambiar a true todavía.
# =========================================================

spring.flyway.enabled=false
